# =============================================================================
#  cd-develop-local.yml — CD da develop: TESTA e PUBLICA LOCAL.
# -----------------------------------------------------------------------------
#  A develop é a branch de INTEGRAÇÃO. A cada push (normalmente o auto-merge de
#  um PR), roda build+test e, se passar, SOBE a API via docker compose conectada
#  ao Postgres LOCAL (self-hosted runner = seu PC).
#
#  O docker-compose.yml de back-end/:
#    1) constrói a imagem (--build);
#    2) sobe o migrator (aplica migrations no Postgres LOCAL e encerra);
#    3) sobe a API conectada a esse banco, via StrCon_UserPost18 com o Host
#       trocado para host.docker.internal.
# =============================================================================
name: CD Develop - Testes + Publicação Local

on:
  workflow_dispatch:          # permite disparo manual pela aba Actions
  push:
    branches:
      - spr01/api/develop

jobs:
  # 1) Primeiro valida: build + test (tijolo reutilizável).
  build-test:
    uses: ./.github/workflows/_build-test.yml

  # 2) Só publica se os testes passarem (needs).
  publicar-local:
    needs: build-test
    runs-on: self-hosted

    # docker compose e Dockerfiles ficam em back-end/.
    defaults:
      run:
        working-directory: back-end

    steps:
      - name: Baixar o código (checkout)
        uses: actions/checkout@v4

      # Diagnóstico: provar que o Docker está acessível no runner.
      - name: Verificar o Docker
        run: docker version

      # Diagnóstico: garantir que a connection string está visível para o runner
      # (sem imprimir o valor, para não vazar usuário/senha nos logs).
      - name: Verificar a connection string do host
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:StrCon_UserPost18)) {
            Write-Error "StrCon_UserPost18 nao esta visivel para o runner. Defina-a e REINICIE o runner (as variaveis de ambiente sao herdadas na inicializacao do processo)."
            exit 1
          }
          Write-Host "OK: StrCon_UserPost18 esta definida (valor omitido de proposito)."

      # Limpeza: derruba uma execução anterior, se existir.
      - name: Derrubar execução anterior (se houver)
        continue-on-error: true
        run: docker compose down --remove-orphans

      # Sobe: constrói a imagem com o código deste push e sobe migrator + API.
      - name: Subir a API conectada ao banco local (compose up)
        run: docker compose up -d --build

      # Prova: API deve ficar "Up"; o migrator "exited (0)".
      - name: Confirmar contêineres no ar
        run: docker compose ps -a
