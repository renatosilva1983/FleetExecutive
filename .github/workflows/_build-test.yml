# =============================================================================
#  _build-test.yml — TIJOLO reutilizável: restaura, compila, migra e testa.
# -----------------------------------------------------------------------------
#  NÃO roda sozinho — é CHAMADO por outros (via "uses:"). Runner GitHub-hosted.
#
#  Como os testes de integração usam um Postgres REAL (ApiTestFactory lê a
#  connection string de StrCon_UserPost18), subimos um Postgres de SERVIÇO
#  (service container), recriamos os roles/banco (bootstrap) e rodamos as
#  migrations (schema + catálogos) ANTES de "dotnet test".
# =============================================================================
name: _build-test (reutilizável)

on:
  workflow_call: {}

jobs:
  build-test:
    runs-on: ubuntu-latest

    # Postgres efêmero para os testes de integração.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      # A mesma variável que o app/migrator/testes usam. Aponta para o service.
      StrCon_UserPost18: "Host=localhost;Port=5432;Database=fleetexecutive_master;Username=fleetexecutive;Password=fleetexecutive_dev_only;options='-c role=app_owner'"
      PGPASSWORD: postgres

    defaults:
      run:
        working-directory: back-end # onde está a solution

    steps:
      - name: Baixar o código (checkout)
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # Recria os roles/usuário/banco que a connection string espera.
      # (o cliente psql já vem instalado no runner ubuntu-latest)
      - name: Bootstrap do banco (roles + database)
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE app_owner NOLOGIN;
          GRANT app_owner TO postgres;
          CREATE ROLE fleetexecutive LOGIN PASSWORD 'fleetexecutive_dev_only' IN ROLE app_owner;
          CREATE DATABASE fleetexecutive_master OWNER app_owner;
          SQL

      - name: Restore
        run: dotnet restore FleetExecutive.sln

      - name: Build
        run: dotnet build FleetExecutive.sln -c Release --no-restore

      # Cria o schema (master + tenant em banco único de dev) e semeia os catálogos.
      - name: Migrations (schema + catálogos)
        run: dotnet run -c Release --no-build --project tools/FleetExecutive.MigrationRunner/FleetExecutive.MigrationRunner.csproj

      - name: Test
        run: dotnet test FleetExecutive.sln -c Release --no-build --verbosity normal
