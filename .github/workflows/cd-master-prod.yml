      # │  Ambiente ainda não contratado. Hoje este job só confirma que os     │
      # │  testes passaram. Quando a produção existir, troque o echo abaixo     │
      # │  pelos passos reais (publicar imagem versionada, aplicar no servidor/ │
      # │  cluster de prod, rodar smoke tests / health check).                  │
      # └────────────────────────────────────────────────────────────────────┘
      - name: (placeholder) Deploy em produção
        run: echo "TODO deploy PRODUCAO - ambiente ainda nao contratado. Build e testes OK."
