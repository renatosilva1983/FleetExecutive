<form class="card empresa-form" [formGroup]="form" (ngSubmit)="salvar()">
  <div class="card-title">Dados da empresa</div>

  <div class="form-row">
    <div class="form-group">
      <label>Razão social</label>
      <input type="text" formControlName="razaoSocial" />
    </div>
    <div class="form-group">
      <label>CNPJ</label>
      <input type="text" formControlName="cnpj" />
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>E-mail comercial</label>
      <input type="email" formControlName="email" />
    </div>
    <div class="form-group">
      <label>Telefone</label>
      <input type="text" formControlName="telefone" />
    </div>
  </div>

  <div class="card-title section-gap">Regras comerciais</div>
  <div class="form-row">
    <div class="form-group">
      <label>Margem mínima (%)</label>
      <input type="number" formControlName="margemMinima" />
    </div>
    <div class="form-group">
      <label>Meta de NPS</label>
      <input type="number" formControlName="metaNps" />
    </div>
  </div>

  <div class="empresa-actions">
    <button type="submit" class="btn-primary">Salvar alterações</button>
  </div>
</form>
