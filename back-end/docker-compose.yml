# =============================================================================
#  docker-compose.yml  —  FleetExecutive.Api (conectando ao banco LOCAL)
# -----------------------------------------------------------------------------
#  O Dockerfile ensina a construir UMA imagem. O Docker Compose sobe VÁRIOS
#  contêineres de uma vez e faz eles conversarem entre si. Aqui, porém, NÃO
#  subimos um contêiner de banco de dados: a API e o migrator se conectam ao
#  PostgreSQL que já roda na SUA máquina (o "banco local"), fora do Docker.
#
#      docker compose up            # sobe a API (use --build na 1ª vez ou após mudar código)
#      docker compose up -d --build # sobe em segundo plano (-d = detached) reconstruindo a imagem
#      docker compose down          # derruba os contêineres
#
#  Como um contêiner alcança o banco que roda no HOST?
#  ---------------------------------------------------
#  Dentro de um contêiner, "localhost" é o PRÓPRIO contêiner, não o seu PC.
#  Para falar com um serviço que roda no host, usa-se o nome especial
#  "host.docker.internal" (no Docker Desktop). Se a sua connection string usar
#  "localhost", troque para "host.docker.internal". O "extra_hosts" abaixo
#  garante que esse nome resolva para o host mesmo no Linux/WSL.
#
#  A connection string em si NÃO fica escrita aqui: ela vem da variável de
#  ambiente "StrCon_UserPost18" definida na SUA máquina. O Compose lê essa
#  variável do host e injeta nos contêineres via ${StrCon_UserPost18}.
# =============================================================================

services:

  # ===========================================================================
  #  SERVIÇO 1 — Migrator (aplica as migrations do banco e ENCERRA)
  # ---------------------------------------------------------------------------
  #  Não é um serviço que fica no ar: é uma tarefa de "run once". Ele sobe,
  #  prepara o schema do banco LOCAL e sai. A API só começa depois que ele
  #  termina com sucesso (ver depends_on lá embaixo).
  # ===========================================================================
  migrator:
    build:
      context: .
      dockerfile: Dockerfile.migrator

    container_name: FleetExecutive-migrator

    environment:
      # O app lê a connection string diretamente da variável "StrCon_UserPost18"
      # (ver AddInfrastructure). Repassamos o valor do HOST, MAS forçando o Host
      # para "host.docker.internal": o valor original usa "Host=localhost", que
      # dentro do contêiner apontaria para ele mesmo — não para o seu PC. Como
      # numa connection string do .NET/Npgsql a ÚLTIMA ocorrência de uma chave
      # vence, ao acrescentar ";Host=host.docker.internal" no fim sobrescrevemos
      # só o host e mantemos porta/banco/usuário/senha.
      StrCon_UserPost18: "${StrCon_UserPost18};Host=host.docker.internal"

    # Permite que "host.docker.internal" resolva para o host também no Linux/WSL.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # "no" = se a tarefa falhar, o compose NÃO fica reiniciando em loop.
    restart: "no"

  # ===========================================================================
  #  SERVIÇO 2 — A aplicação FleetExecutive.Api
  # ===========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: FleetExecutive-api

    environment:
      # Ambiente da aplicação. "Development" habilita a documentação Scalar/OpenAPI
      # (veja o Program.cs). Em produção você usaria "Production".
      ASPNETCORE_ENVIRONMENT: Development

      # ---- Connection string do banco ----
      # O app lê a variável "StrCon_UserPost18" diretamente (ver AddInfrastructure).
      # Repassamos o valor da máquina com o Host sobrescrito para
      # "host.docker.internal" (a última chave repetida vence) — assim o contêiner
      # alcança o Postgres que roda no seu PC em vez de "localhost".
      StrCon_UserPost18: "${StrCon_UserPost18};Host=host.docker.internal"

      # Chave JWT (Jwt:Key -> Jwt__Key). Em produção isto viria de um cofre de
      # segredos, nunca escrito no arquivo. Aqui é só para estudo.
      Jwt__Key: "__DEV_ONLY_CHANGE_ME_troque-em-producao-para-um-segredo-forte__"

    # Publica a API: acesse em http://localhost:5000
    # (host 5000  ->  contêiner 8080, que é a porta configurada no Dockerfile).
    ports:
      - "5000:8080"

    # Permite que "host.docker.internal" resolva para o host também no Linux/WSL.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # A API só sobe depois que o migrator concluir com sucesso (schema pronto).
    depends_on:
      migrator:
        condition: service_completed_successfully
