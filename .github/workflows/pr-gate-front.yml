# =============================================================================
#  pr-gate-front.yml — "PR gate" do Front: valida o PR e, se passar, MERGE AUTO.
# -----------------------------------------------------------------------------
#  Vale para PRs mirando develop / front-release / master, SÓ quando o PR mexe
#  no front-end (paths). Fluxo: build (via _build-test-front) -> se verde,
#  mergeia sozinho. O merge usa o secret PAT_MERGE (para o push do merge
#  disparar o CD de destino, ex.: cd-front-release).
# =============================================================================
name: PR Gate Front - Build e Auto-merge

on:
  pull_request:
    branches:
      - spr01/develop
      - spr01/front/release
      - master
    paths:
      - "front-end/**" # só valida quando o PR mexe no front-end

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    uses: ./.github/workflows/_build-test-front.yml

  auto-merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Merge automático do PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_MERGE }}
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              merge_method: 'merge',
            });
            core.info('✔ Build do front OK — PR mergeado automaticamente.');
