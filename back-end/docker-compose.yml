# =============================================================================
#  docker-compose.yml  —  FleetExecutive.Api  (usando o PostgreSQL LOCAL da máquina)
# -----------------------------------------------------------------------------
#  Nesta configuração NÃO subimos um Postgres em contêiner. A API e o migrator
#  (ambos rodando dentro de contêineres) se conectam ao PostgreSQL instalado na
#  SUA máquina — aquele que já tem o banco Bessa_master com a tabela TenantInfo.
#
#  Como um contêiner enxerga a sua máquina? Pelo nome especial
#  "host.docker.internal", que o Docker Desktop resolve para o host (a sua
#  máquina). É o substituto de "localhost": dentro do contêiner, "localhost" é o
#  próprio contêiner, não o seu PC.
#
#  PRÉ-REQUISITO (feito uma vez no seu Postgres) — sem isso a conexão é recusada:
#    1) postgresql.conf: listen_addresses = '*'   (o seu já está assim)
#    2) pg_hba.conf: liberar a rede do Docker, ex.:
#         host  all  all  0.0.0.0/0  scram-sha-256      # dev-only; veja nota no chat
#    3) recarregar: SELECT pg_reload_conf();   (ou reiniciar o serviço)
#
#      docker compose up --build    # sobe API + migrator, reconstruindo as imagens
#      docker compose down          # derruba os contêineres
# =============================================================================

services:

  # ===========================================================================
  #  SERVIÇO 1 — Migrator (aplica as migrations do banco master e ENCERRA)
  # ---------------------------------------------------------------------------
  #  Tarefa "run once": sobe, garante o schema do banco master e sai. Como o seu
  #  banco local JÁ tem as migrations aplicadas, na prática ele vai reportar
  #  "nada a aplicar" e sair com sucesso — mantendo o schema sempre em dia.
  #  (Se preferir, pode comentar este serviço e o depends_on da API abaixo.)
  # ===========================================================================
  migrator:
    build:
      context: .
      dockerfile: Dockerfile.migrator

    container_name: FleetExecutive-migrator

    # extra_hosts garante o "host.docker.internal" também fora do Docker Desktop
    # (no Docker Desktop já existe por padrão; aqui deixamos explícito/portável).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      # Aponta para o Postgres da SUA máquina (host.docker.internal), não mais
      # para um contêiner. Ajuste a senha se o seu usuário Bessa usar outra.
      ConnectionStrings__Master: "Host=host.docker.internal;Port=5432;Database=FleetExecutive_Dev;Username=fleetexecutive_user_dev;Password=fleetexecutive_user_dev_pws;options='-c role=app_owner'"

    # "no" = tarefa pontual; se falhar, não fica reiniciando em loop.
    restart: "no"

  # ===========================================================================
  #  SERVIÇO 2 — A aplicação FleetExecutive.Api
  # ===========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: FleetExecutive-api

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      ASPNETCORE_ENVIRONMENT: Development

      # Mesmo Postgres local do migrator. Repare no Host=host.docker.internal.
      ConnectionStrings__Master: "Host=host.docker.internal;Port=5432;Database=FleetExecutive_Dev;Username=fleetexecutive_user_dev;Password=fleetexecutive_user_dev_pws;options='-c role=app_owner'"

      Jwt__Key: "__DEV_ONLY_CHANGE_ME_troque-em-producao-para-um-segredo-forte__"

    # Publica a API em http://localhost:5000  (host 5000 -> contêiner 8080).
    ports:
      - "5000:8080"

    # A API só sobe depois que o migrator terminar com sucesso (schema pronto).
    # Não há mais dependência de um contêiner de banco: o banco é o seu local.
    depends_on:
      migrator:
        condition: service_completed_successfully
